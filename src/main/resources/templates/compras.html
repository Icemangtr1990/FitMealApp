<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lista de la compra - FitMealApp')}"></head>
<body class="d-flex flex-column">

<div th:replace="~{fragments/layout :: navbar('compras')}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">
    <header class="page-heading">
        <h1>🛒 Lista de la compra</h1>
        <p>Ingredientes agrupados de tus recetas planificadas. Marca lo que ya tengas.</p>
    </header>

    <form method="get" th:action="@{/compras}" class="form-filter row g-2 align-items-end mb-4 no-print">
        <div class="col-sm-4 col-md-3">
            <label for="fechaDesde" class="form-label mb-0">Desde</label>
            <input type="date" class="form-control" id="fechaDesde" name="fechaDesde" th:value="${fechaDesde}">
        </div>
        <div class="col-sm-4 col-md-3">
            <label for="fechaHasta" class="form-label mb-0">Hasta</label>
            <input type="date" class="form-control" id="fechaHasta" name="fechaHasta" th:value="${fechaHasta}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">🔍 Filtrar</button>
        </div>
        <div class="col-auto">
            <a th:href="@{/compras}" class="btn btn-secondary">Ver todas</a>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(listaCompras)}" class="empty-state">
        <div class="emoji">🧺</div>
        <h3>Nada en la cesta</h3>
        <p>No hay ingredientes para las fechas seleccionadas. Prueba con otro rango o asigna recetas en el planificador.</p>
    </div>

    <section th:unless="${#lists.isEmpty(listaCompras)}" class="app-card">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div class="section-title mb-0"><span class="emoji">🥬</span><h2 class="h4 mb-0">Ingredientes agrupados</h2></div>
            <button type="button" class="btn btn-soft btn-sm no-print" onclick="window.print()">🖨️ Imprimir lista</button>
        </div>

        <ul class="app-list">
            <li th:each="item : ${listaCompras}">
                <label class="d-flex align-items-center gap-3 mb-0 flex-grow-1" th:for="'item-' + ${itemStat.index}">
                    <input type="checkbox" class="qty-check no-print" th:id="'item-' + ${itemStat.index}">
                    <span>
                        <span class="item-name" th:text="${item.ingrediente}">Ingrediente</span>
                        <span class="item-meta d-block" th:text="'Recetas: ' + ${item.recetasTexto}">Recetas</span>
                    </span>
                </label>
                <span class="item-qty" th:text="${item.cantidadTotal}">Cantidad</span>
            </li>
        </ul>
    </section>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
