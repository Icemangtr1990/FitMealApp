<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Planificador - FitMealApp')}"></head>
<body class="d-flex flex-column">

<div th:replace="~{fragments/layout :: navbar('planificador')}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">
    <header class="page-heading d-flex flex-wrap justify-content-between align-items-end gap-2">
        <div>
            <h1>🗓️ Mi planificador</h1>
            <p>Las recetas que tienes asignadas, con su fecha.</p>
        </div>
        <a class="btn btn-soft" th:href="@{/compras}">Ver lista de la compra →</a>
    </header>

    <div th:if="${#lists.isEmpty(recetasAsignadas)}" class="empty-state">
        <div class="emoji">📅</div>
        <h3>Tu semana está libre</h3>
        <p>Pide a un administrador que te asigne una receta desde el listado de recetas.</p>
        <a class="btn btn-primary mt-3" th:href="@{/recetas}">Ver recetas</a>
    </div>

    <div class="row g-3" th:unless="${#lists.isEmpty(recetasAsignadas)}">
        <article class="col-lg-6" th:each="receta : ${recetasAsignadas}">
            <div class="app-card h-100">
                <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
                    <h2 class="h5 mb-0" th:text="${receta.nombreReceta}">Receta</h2>
                    <span class="app-badge" th:text="${receta.fechaFormateada}">00/00/0000</span>
                </div>
                <p class="text-muted mb-2" th:text="${receta.descripcion}">Descripción</p>
                <p class="mb-1"><strong>Ingredientes:</strong> <span th:text="${receta.ingredientesFormateados}"></span></p>
                <p class="mb-3"><strong>Preparación:</strong> <span th:text="${receta.instrucciones}"></span></p>
                <span class="item-meta">Asignada a ti</span>
            </div>
        </article>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
