<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear usuario - FitMealApp')}"></head>
<body class="d-flex flex-column">

<div th:replace="~{fragments/layout :: navbar('usuarios')}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">
    <header class="page-heading">
        <h1>👤 Crear usuario</h1>
        <p>Añade una nueva persona con su rol en la aplicación.</p>
    </header>

    <div class="app-card" style="max-width: 640px;">
        <form th:action="@{/admin/crear-usuario}" method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="nombre" class="form-label">Nombre de usuario</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej. maria" required>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="maria@ejemplo.com" required>
                </div>
                <div class="col-md-6">
                    <label for="passwd" class="form-label">Contraseña</label>
                    <input type="password" id="passwd" name="passwd" class="form-control" minlength="4" required>
                </div>
                <div class="col-md-6">
                    <label for="userRole" class="form-label">Rol</label>
                    <select id="userRole" name="userRole" class="form-select">
                        <option value="usuario">Usuario</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Crear usuario</button>
                    <a class="btn btn-secondary" th:href="@{/admin/listar-usuarios}">Ver usuarios</a>
                </div>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
