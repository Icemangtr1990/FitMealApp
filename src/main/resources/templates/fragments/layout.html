<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FitMealApp: planifica tus comidas, organiza tu semana y haz la compra fácilmente." />
    <title th:text="${titulo}">FitMealApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" th:href="@{/css/styles.css?v=3}" />
</head>

<body>
    <!-- ===================== NAVBAR ===================== -->
    <nav th:fragment="navbar(activo)" class="app-navbar navbar navbar-expand-lg">
        <div class="container">
            <a class="app-brand" th:href="@{/index}">
                <span class="app-brand-icon">🥗</span>
                <span>Fit<span>Meal</span>App</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#appNav"
                    aria-controls="appNav" aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="appNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="app-nav-link" th:classappend="${activo == 'recetas'} ? 'active'"
                           th:href="@{/recetas}">Recetas</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="app-nav-link" th:classappend="${activo == 'planificador'} ? 'active'"
                           th:href="@{/planificador}">Planificador</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="app-nav-link" th:classappend="${activo == 'compras'} ? 'active'"
                           th:href="@{/compras}">Lista de la compra</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <div sec:authorize="hasRole('admin')" class="d-flex gap-2">
                        <a class="btn btn-sm btn-soft" th:href="@{/crearUsuario}">＋ Usuario</a>
                        <a class="btn btn-sm btn-soft" th:href="@{/admin/listar-usuarios}">Usuarios</a>
                    </div>
                    <span class="app-user" sec:authorize="isAuthenticated()"
                          th:text="${#authentication.name}">Usuario</span>
                    <div sec:authorize="isAnonymous()">
                        <a class="btn btn-primary btn-sm" th:href="@{/loggin}">Iniciar sesión</a>
                    </div>
                    <div sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Salir</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- ===================== MENSAJES FLASH ===================== -->
    <div th:fragment="flash" class="container mt-4">
        <div th:if="${mensaje}" class="app-alert app-alert-ok" role="alert" th:text="${mensaje}"></div>
        <div th:if="${error}" class="app-alert app-alert-error" role="alert" th:text="${error}"></div>
    </div>

    <!-- ===================== FOOTER ===================== -->
    <footer th:fragment="footer" class="app-footer mt-auto">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span>© <span th:text="${#dates.year(#dates.createNow())}">2026</span> FitMealApp · Hecho con 🥬 y Java</span>
            <a th:href="@{/index}">Volver al inicio ↑</a>
        </div>
    </footer>

    <!-- ===================== SCRIPTS ===================== -->
    <div th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                document.querySelectorAll('form[data-confirm]').forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!window.confirm(form.dataset.confirm || '¿Estás seguro?')) {
                            event.preventDefault();
                        }
                    });
                });
            });
        </script>
    </div>

</body>
</html>
