<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios - FitMealApp')}"></head>
<body class="d-flex flex-column">

<div th:replace="~{fragments/layout :: navbar('usuarios')}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">
    <header class="page-heading d-flex flex-wrap justify-content-between align-items-end gap-2">
        <div>
            <h1>👥 Usuarios</h1>
            <p>Personas con acceso a FitMealApp.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/crearUsuario}">＋ Nuevo usuario</a>
    </header>

    <div class="app-card-flat">
        <div class="table-responsive">
            <table class="app-table">
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td class="fw-bold" th:text="${usuario.nombre}">Nombre</td>
                        <td th:text="${usuario.email}">email</td>
                        <td>
                            <span class="app-badge"
                                  th:classappend="${usuario.userRole == 'admin'} ? ' app-badge-admin' : ' app-badge-user'"
                                  th:text="${usuario.userRole}">rol</span>
                        </td>
                        <td class="text-end">
                            <form th:action="@{/admin/eliminar-usuario/{id}(id=${usuario.idUser})}" method="post"
                                  data-confirm="¿Eliminar al usuario? Esta acción no se puede deshacer.">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
