<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión - FitMealApp')}"></head>
<body class="d-flex flex-column">

<div class="login-wrap">
    <div class="login-card">
        <div class="login-head">
            <div style="font-size: 2.6rem;">🥗</div>
            <h1>FitMealApp</h1>
            <p class="mb-0" style="opacity:.85;">Tu semana, más fácil</p>
        </div>
        <div class="login-body">
            <div th:if="${param.logout}" class="app-alert app-alert-ok">Sesión cerrada correctamente.</div>
            <div th:if="${param.error}" class="app-alert app-alert-error">Usuario o contraseña incorrectos.</div>

            <form method="post" th:action="@{/logginprocess}">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" id="username" name="username" class="form-control"
                           autocomplete="username" placeholder="Tu usuario" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control"
                           autocomplete="current-password" placeholder="Tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar →</button>
            </form>

            <p class="text-center text-muted mt-4 mb-0" style="font-size:.9rem;">
                ¿No tienes cuenta? Pide acceso al administrador.
            </p>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
