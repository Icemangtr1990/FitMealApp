# Perfil de producción: credenciales SOLO desde variables de entorno.
spring.datasource.url=${FITMEAL_DB_URL}
spring.datasource.username=${FITMEAL_DB_USER}
spring.datasource.password=${FITMEAL_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.baseline-on-migrate=false
logging.level.es.dsw=INFO
