spring.application.name=FitMealApp
server.servlet.session.timeout=300
spring.session.store-type=none

# ---------------------------------------------------------------------------
# Conexión a MySQL.
# Los valores se pueden sobrescribir con variables de entorno:
# FITMEAL_DB_HOST, FITMEAL_DB_PORT, FITMEAL_DB_NAME, FITMEAL_DB_USER,
# FITMEAL_DB_PASSWORD y FITMEAL_DB_URL / FITMEAL_DB_DRIVER.
# ---------------------------------------------------------------------------
fitmeal.db.host=localhost
fitmeal.db.port=3306
fitmeal.db.name=recetas_app
fitmeal.db.username=root
fitmeal.db.password=1234

# DataSource de Spring Boot (HikariCP). Si se define fitmeal.db.url se usa tal cual.
spring.datasource.url=${fitmeal.db.url:jdbc:mysql://${fitmeal.db.host:localhost}:${fitmeal.db.port:3306}/${fitmeal.db.name:recetas_app}?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${fitmeal.db.username:root}
spring.datasource.password=${fitmeal.db.password:1234}
spring.datasource.driver-class-name=${fitmeal.db.driver:com.mysql.cj.jdbc.Driver}
spring.datasource.hikari.pool-name=FitMealPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
