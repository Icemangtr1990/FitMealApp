# Configuración H2 en memoria para los tests (misma BD que usa TestDatabase).
fitmeal.db.url=jdbc:h2:mem:fitmeal;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
fitmeal.db.driver=org.h2.Driver
fitmeal.db.username=sa
fitmeal.db.password=

spring.datasource.url=${fitmeal.db.url}
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.pool-name=FitMealTestPool
spring.datasource.hikari.maximum-pool-size=5

# Los tests crean su propio esquema con TestDatabase
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
